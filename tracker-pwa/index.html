<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tracker - Entrenamiento y Sobrecarga Progresiva</title>

  <!-- Metas PWA e iOS Standalone Safari -->
  <meta name="description" content="Seguimiento minimalista de hipertrofia y fuerza sin conexión en iPhone">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="theme-color" content="#0a0c10">

  <!-- Iconos e inicio -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <!-- Estilos CSS Vanilla modulares -->
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <div id="app">
    <!-- Encabezado superior -->
    <header class="app-header">
      <div class="header-title">
        <img src="./icons/icon-192.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 8px; object-fit: cover; border: 1.5px solid var(--border-subtle);">
        <span>TRACKER</span>
      </div>
      <div id="header-status-indicator" style="font-size: 0.8rem; font-weight: 700; color: var(--accent-primary); display: none;">
        ● EN ENTRENAMIENTO
      </div>
    </header>

    <!-- Banner de actualización de Service Worker -->
    <div id="sw-update-banner" class="update-banner">
      <div style="font-size: 0.85rem; font-weight: 700;">
        ⚡ Nueva versión disponible
      </div>
      <button type="button" id="sw-update-btn">Actualizar</button>
    </div>

    <!-- Contenedor principal con scroll vertical -->
    <main id="main-content" class="content-area"></main>

    <!-- Barra de navegación inferior fija (Bottom Tab Bar) -->
    <nav class="bottom-nav" id="bottom-nav">
      <!-- 1. Entrenar -->
      <button type="button" class="nav-item active" data-tab="workout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12"></path>
        </svg>
        <span>Entrenar</span>
      </button>

      <!-- 2. Historial -->
      <button type="button" class="nav-item" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Historial</span>
      </button>

      <!-- 3. Progreso -->
      <button type="button" class="nav-item" data-tab="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Progreso</span>
      </button>

      <!-- 4. Rutinas -->
      <button type="button" class="nav-item" data-tab="routines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Rutinas</span>
      </button>

      <!-- 5. Ajustes -->
      <button type="button" class="nav-item" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
